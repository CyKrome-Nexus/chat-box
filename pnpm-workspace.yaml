packages:
  - apps/*
  - packages/*

# React Native's Metro and native autolinking expect a flat node_modules tree.
nodeLinker: hoisted

allowBuilds:
  "@node-rs/argon2": true
  esbuild: true
  mongodb-memory-server: true

# Server images install only their own slice of the workspace, so mobile-only patches go unused there.
allowUnusedPatches: true

patchedDependencies:
  expo-constants@18.0.13: patches/expo-constants@18.0.13.patch
  react-native-callkeep@4.3.16: patches/react-native-callkeep@4.3.16.patch
