# CI/CD for Chatbox. See docs/deployment.md.
#
#   feature/* ──PR──▶ dev ──PR──▶ qa ──PR──▶ main
#
# Pushes to an environment branch publish ghcr.io/cykrome-nexus/chat-box-{api,web} tagged with the
# branch name and commit, then trigger that environment's Dokploy deploy webhooks.

name: CI/CD

on:
  pull_request:
    branches: [dev, qa, main]
  push:
    branches: [dev, qa, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_PREFIX: ghcr.io/cykrome-nexus/chat-box

jobs:
  verify:
    name: Typecheck, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g pnpm@12.4.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm turbo run build --filter=@chatbox/api --filter=@chatbox/web

  image:
    name: Publish ${{ matrix.app }} image
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: linux/arm64,linux/amd64
          build-args: GIT_SHA=${{ github.sha }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.app }}:${{ github.ref_name }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.app }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max

  deploy:
    name: Deploy ${{ github.ref_name }}
    needs: image
    if: github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Deploy and verify
        env:
          BRANCH: ${{ github.ref_name }}
          WEBHOOK_API_DEV: ${{ secrets.DOKPLOY_WEBHOOK_API_DEV }}
          WEBHOOK_WEB_DEV: ${{ secrets.DOKPLOY_WEBHOOK_WEB_DEV }}
          WEBHOOK_API_QA: ${{ secrets.DOKPLOY_WEBHOOK_API_QA }}
          WEBHOOK_WEB_QA: ${{ secrets.DOKPLOY_WEBHOOK_WEB_QA }}
          WEBHOOK_API_PRODUCTION: ${{ secrets.DOKPLOY_WEBHOOK_API_PRODUCTION }}
          WEBHOOK_WEB_PRODUCTION: ${{ secrets.DOKPLOY_WEBHOOK_WEB_PRODUCTION }}
          API_URL_DEV: ${{ vars.API_URL_DEV }}
          API_URL_QA: ${{ vars.API_URL_QA }}
          API_URL_PRODUCTION: ${{ vars.API_URL_PRODUCTION }}
        run: ./scripts/deploy.sh "$BRANCH" "${{ github.sha }}"
